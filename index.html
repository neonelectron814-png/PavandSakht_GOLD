    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
      /* Global Smooth & Elegant Golden Scrollbars for all platforms & browsers */
      html {
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        overflow-y: auto;
      }
      body {
        min-height: 100vh;
        overflow-x: hidden;
      }
      /* Custom Luxury Gold Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #fbf9f4;
      }
      ::-webkit-scrollbar-thumb {
        background: #dfc282;
        border-radius: 8px;
        border: 2px solid #fbf9f4;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b88a31;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #dfc282 #fbf9f4;
      }
    </style>
  </head>
  <body class="bg-[#fcfbf9] text-[#1c1d22] antialiased select-none font-['Vazirmatn',system-ui,sans-serif]">
    <!-- Global Persistent SVG 3D Gold Palette (Cached instantly by browser with 0ms network latency) -->
    <svg width="0" height="0" class="absolute hidden" aria-hidden="true">
      <defs>
        <linearGradient id="gold-metal-primary" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#fdf1c9" />
          <stop offset="25%" stop-color="#e9be6f" />
          <stop offset="50%" stop-color="#be8828" />
          <stop offset="75%" stop-color="#f1d48c" />
          <stop offset="100%" stop-color="#83570c" />
        </linearGradient>
        <linearGradient id="gold-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#b48227" />
          <stop offset="50%" stop-color="#81540a" />
          <stop offset="100%" stop-color="#4f3102" />
        </linearGradient>
        <radialGradient id="gold-radial" cx="30%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#fffcf0" />
          <stop offset="30%" stop-color="#e8bf72" />
          <stop offset="70%" stop-color="#b07d1e" />
          <stop offset="100%" stop-color="#5d3903" />
        </radialGradient>
        <linearGradient id="gold-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
          <stop offset="100%" stop-color="#e5b863" stop-opacity="0.2" />
        </linearGradient>
      </defs>
    </svg>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
